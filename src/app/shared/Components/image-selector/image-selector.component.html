

   <div class="image-selector-container" *ngIf="showimageselector()">
  <button type="button" class="btn btn-danger"
          style="position: fixed; top: 10px; right: 10px; z-index: 1050;"
          (click)="hideimageselector()">
    X
  </button>

<div class="card h-100">
<div class="card-header">
    <h3 class="card-title">Images</h3>

    
</div>
   <div class="card-body">
  <div class="d-flex flex-column flex-md-row flex-wrap">

    <div class="col-12 col-md-8 p-4">
      <!-- images gallery goes here -->
    </div>

    <div class="col-12 col-md-4 p-4 bg-light">
      <h5>Upload Image</h5>
      <form>
        <div class="mt-3">
          <input type="text" class="form-control" placeholder="File Name">
        </div>
        <div class="mt-3">
          <input type="text" class="form-control" placeholder="Title">
        </div>
        <div class="mt-3">
          <button type="submit" class="btn btn-dark">Upload</button>
        </div>
      </form>
    </div>

  </div>
</div>
    </div>
</div>
