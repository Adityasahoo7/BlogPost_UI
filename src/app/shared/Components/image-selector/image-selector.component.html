@if(showimageselector()){

    <div class="image-selector-container">
        <button type="button" class="btn btn-light"
        style="position: fixed; top: 10px; height: 10px;"
        (click)="hideimageselector()">
        X
        </button>

<div class="card h-100">
<div class="card-header">
    <h3 class="card-title">Images</h3>

    
</div>
<div class="card-body">
<div class="d-flex flex-md-column flex-md-row flex-wrap">
<div class="col-8 p-4">

</div>
<div class="col-4 p-4 bg-light">
<h5>Uplode Image</h5>
<form >
    <div class="mt-3">
        <input type="text" class="form-control" placeholder="File Name">

    </div>
    
    <div class="mt-3">
        <input type="text" class="form-control" placeholder="Title">
        
    </div>
    <div class="mt-3">
        <button type="submit" class="btn btn-dark">
            Upload
        </button>

    </div>

</form>

</div>

</div>
</div>
</div>
</div>
}
