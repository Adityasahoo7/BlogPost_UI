<div class="container py-5">

  <div *ngIf="isLoading" class="text-center py-5">
    <div class="spinner-border text-primary" role="status">
      <span class="visually-hidden">Loading...</span>
    </div>
  </div>

  <div *ngIf="errorMessage" class="alert alert-danger">
    {{ errorMessage }}
    <a routerLink="/" class="alert-link ms-2">Back to home</a>
  </div>

  <article *ngIf="blogpost" class="mx-auto" style="max-width: 800px;">

    <a routerLink="/" class="btn btn-link px-0 mb-3">&larr; Back to all posts</a>

    <h1 class="fw-bold mb-3">{{ blogpost.title }}</h1>

    <div class="d-flex flex-wrap gap-2 align-items-center text-muted mb-4">
      <span>{{ blogpost.auther }}</span>
      <span>&middot;</span>
      <span>{{ blogpost.dateCreated | date: 'dd MMM yyyy' }}</span>
      <span class="badge bg-secondary" *ngFor="let category of blogpost.categotys">
        {{ category.name }}
      </span>
    </div>

    <img *ngIf="blogpost.featuredImageURL"
         [src]="blogpost.featuredImageURL"
         [alt]="blogpost.title"
         class="img-fluid rounded mb-4 w-100">

    <p class="lead text-muted">{{ blogpost.shortDescription }}</p>

    <hr class="my-4">

    <markdown [data]="blogpost.content"></markdown>

  </article>

</div>
