<div class="container py-5">

  <div class="mb-5">
    <h1 class="display-5 fw-bold">Latest posts</h1>
    <p class="text-muted">Articles, tutorials and notes.</p>
  </div>

  <div *ngIf="isLoading" class="text-center py-5">
    <div class="spinner-border text-primary" role="status">
      <span class="visually-hidden">Loading...</span>
    </div>
  </div>

  <div *ngIf="errorMessage" class="alert alert-danger">{{ errorMessage }}</div>

  <div *ngIf="!isLoading && !errorMessage && blogposts.length === 0" class="alert alert-info">
    No blog posts published yet.
  </div>

  <div class="row g-4">
    <div class="col-md-6 col-lg-4" *ngFor="let post of blogposts">
      <div class="card h-100 shadow-sm border-0">

        <img *ngIf="post.featuredImageURL"
             [src]="post.featuredImageURL"
             [alt]="post.title"
             class="card-img-top blog-thumb">

        <div class="card-body d-flex flex-column">

          <div class="mb-2">
            <span class="badge bg-secondary me-1" *ngFor="let category of post.categotys">
              {{ category.name }}
            </span>
          </div>

          <h5 class="card-title">{{ post.title }}</h5>
          <p class="card-text text-muted flex-grow-1">{{ post.shortDescription }}</p>

          <div class="d-flex justify-content-between align-items-center mt-3">
            <small class="text-muted">
              {{ post.auther }} &middot; {{ post.dateCreated | date: 'dd MMM yyyy' }}
            </small>
            <a class="btn btn-sm btn-primary" [routerLink]="['/blog', post.id]">Read more</a>
          </div>

        </div>
      </div>
    </div>
  </div>

</div>
