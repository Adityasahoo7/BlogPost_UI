<form
  [formGroup]="editBlogPostForm"
  (ngSubmit)="updateBlogPost()">


  <!-- Loading -->
  <div
    *ngIf="isLoading"
    class="text-center mb-3">

    <div
      class="spinner-border"
      role="status">

      <span class="visually-hidden">
        Loading...
      </span>

    </div>

    <p class="mt-2">
      Loading blog post...
    </p>

  </div>


  <!-- Title -->
  <div class="mb-3">

    <label class="form-label">
      Title
    </label>

    <input
      type="text"
      class="form-control"
      formControlName="title">

  </div>


  <!-- Short Description -->
  <div class="mb-3">

    <label class="form-label">
      Short Description
    </label>

    <textarea
      class="form-control"
      rows="3"
      formControlName="shortDescription">
    </textarea>

  </div>


  <!-- Content -->
  <div class="mb-3">

    <div class="d-flex flex-row">

      <!-- Markdown Input -->
      <div class="col-6 p-2">

        <label class="form-label">
          Content
        </label>

        <textarea
          class="form-control"
          rows="8"
          formControlName="content">
        </textarea>

      </div>


      <!-- Markdown Preview -->
      <div
        class="col-6 p-2"
        style="max-height: 360px; overflow-y: scroll">

        <markdown
          [data]="editBlogPostForm.controls['content'].getRawValue()">
        </markdown>

      </div>

    </div>

  </div>


  <!-- URL Handle -->
  <div class="mb-3">

    <label class="form-label">
      URL Handle
    </label>

    <input
      type="text"
      class="form-control"
      formControlName="urlHandle">

  </div>


  <!-- Featured Image -->
  <div class="mb-3">

    <label class="form-label">
      Featured Image URL
    </label>

    <input
      type="text"
      class="form-control"
      formControlName="featuredImageURL"
      placeholder="Enter image URL">


    <div
      class="mt-3"
      *ngIf="editBlogPostForm.get('featuredImageURL')?.value">

      <img
        [src]="editBlogPostForm.get('featuredImageURL')?.value"
        alt="Featured Image Preview"
        style="
          max-width: 300px;
          max-height: 200px;
          object-fit: cover;
        "
        (error)="imageError = true"
        (load)="imageError = false">


      <div
        *ngIf="imageError"
        class="text-danger mt-2">

        ❌ Invalid image URL or image could not be loaded.

      </div>


      <div
        *ngIf="!imageError"
        class="text-success mt-2">

        ✅ Image loaded successfully.

      </div>

    </div>

  </div>


  <!-- Categories -->
  <div class="mb-3">

    <label class="form-label">
      Categories
    </label>


    <select
      class="form-select"
      multiple
      formControlName="categotys">

      <option
        *ngFor="let category of categories"
        [value]="category.id">

        {{ category.name }}

      </option>

    </select>


    <small class="text-muted">
      Hold Ctrl and select multiple categories.
    </small>

  </div>


  <!-- Author -->
  <div class="mb-3">

    <label class="form-label">
      Author
    </label>

    <input
      type="text"
      class="form-control"
      formControlName="auther">

  </div>


  <!-- Is Visible -->
  <div class="form-check mb-3">

    <input
      type="checkbox"
      class="form-check-input"
      formControlName="isvisible">

    <label class="form-check-label">
      Is Visible
    </label>

  </div>


  <!-- Buttons -->
  <button
    type="submit"
    class="btn btn-primary me-2"
    [disabled]="editBlogPostForm.invalid || isLoading">

    Update Blog Post

  </button>


  <button
    type="button"
    class="btn btn-secondary"
    (click)="back()">

    Back

  </button>

</form>
