<div class="container">


    <h1 class="mt-3">
        Category List
    </h1>
    <div class="d-flex justify-content-end mt-3">
        <a [routerLink]="['add']" class="btn btn-primary">Add Category </a>
    </div>

    <div class="container">

  <h2>Category List</h2>

  <!-- Loading -->
  <div *ngIf="isLoading">
    <p>Loading categories...</p>
  </div>

  <!-- Error -->
  <div *ngIf="!isLoading && errormessage">
    <p>{{ errormessage }}</p>

    <button (click)="getallcategory()">
      Retry
    </button>
  </div>

  <!-- No Data -->
  <div *ngIf="!isLoading && !errormessage && categorylist.length === 0">
    <p>No categories found.</p>
  </div>
    </div>

    <table *ngIf="!isLoading && !errormessage && categorylist.length > 0">

    <thead>
        <tr>
            <th>Id</th>
            <th>Name</th>
            <th>UrlHandle</th>
            <th>Actions</th>
        </tr>
    </thead>

    <tbody>
        <tr *ngFor="let category of categorylist">

            <td>{{ category.id }}</td>
            <td>{{ category.name }}</td>
            <td>{{ category.urlHandle }}</td>

            <td>
                <button
                    class="btn btn-primary btn-sm me-2"
                    [routerLink]="['edit', category.id]">
                    Edit
                </button>

                <button
                    class="btn btn-danger btn-sm"
                    (click)="deleteCategory(category.id)">
                    Delete
                </button>
            </td>

        </tr>
    </tbody>

</table>

</div>
