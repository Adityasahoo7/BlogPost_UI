<div class="container">
<h1 class="mt-3">Add Category</h1>

<form [formGroup]="addCategoryFormgroup" (ngSubmit)="onsubmit()">
<div class="mt3">
<label  class="form-label">Name</label>
<input type="text" class="form-contro" formControlName="name">
</div>

<div class="mt-3">

    <label for="" class="form-label">URL Handle(SLOG)</label>
    <input type="text" class="form-control" formControlName="urlHandle">
</div>
<div class="mt-3">

    <button type="submit" class="btn btn-primary">Save </button>
</div>

</form>

</div>
