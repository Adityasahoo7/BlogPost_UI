<div class="auth-container">

  <div class="auth-card">

    <h2>Create Account</h2>

    <p class="subtitle">
      Register a new account
    </p>


    <form
      [formGroup]="registerForm"
      (ngSubmit)="register()"
    >


      <!-- Name -->

      <div class="form-group">

        <label>Name</label>

        <input
          type="text"
          formControlName="name"
          placeholder="Enter your name"
        />

        <div
          class="error"
          *ngIf="
            registerForm.get('name')?.touched &&
            registerForm.get('name')?.invalid
          "
        >
          Name is required
        </div>

      </div>


      <!-- Email -->

      <div class="form-group">

        <label>Email</label>

        <input
          type="email"
          formControlName="email"
          placeholder="Enter your email"
        />

        <div
          class="error"
          *ngIf="
            registerForm.get('email')?.touched &&
            registerForm.get('email')?.invalid
          "
        >
          Enter a valid email
        </div>

      </div>


      <!-- Password -->

      <div class="form-group">

        <label>Password</label>

        <input
          type="password"
          formControlName="password"
          placeholder="Enter password"
        />

      </div>


      <!-- Confirm Password -->

      <div class="form-group">

        <label>Confirm Password</label>

        <input
          type="password"
          formControlName="confirmPassword"
          placeholder="Confirm password"
        />

      </div>


      <!-- Error -->

      <div
        class="api-error"
        *ngIf="errorMessage"
      >

        {{ errorMessage }}

      </div>


      <!-- Success -->

      <div
        class="success"
        *ngIf="successMessage"
      >

        {{ successMessage }}

      </div>


      <button
        type="submit"
        [disabled]="loading"
      >

        <span *ngIf="!loading">
          Register
        </span>

        <span *ngIf="loading">
          Creating Account...
        </span>

      </button>


    </form>


    <p class="login-link">

      Already have an account?

      <a routerLink="/login">
        Login
      </a>

    </p>

  </div>

</div>
